<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Projeto Hamburgueria</title>
    <link rel="icon" href="assets/hamburger.ico">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/topo.css">
    <link rel="stylesheet" href="css/normalize.css">
</head>

<body>
    <header>
        <div class="topo">
            <div class="topo-menu">
                <ul>
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#">Lanches</a></li>
                    <li>
                        <div class="logo-topo">
                            <a href="#">
                                <img src="assets/burguer-title.png" alt="burguer">
                                LipeBurguer
                            </a>
                        </div>
                    </li>
                    <li><a href="#">Reviews</a></li>
                    <li><a href="#">Contato</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main>
        <div class="banner">
            <div class="esquerda-banner">
                <img src="assets/burguer-title.png" alt="burguer">
                <h1>LipeBurguer</h1>
                <h2>A melhor hamburgueria virtual de Guarulhos!</h2>
                <p>Hambúrgueres artesanais preparados com ingredientes selecionados, sabor irresistível e entrega rápida
                    para matar sua fome a qualquer hora.</p>

                <button class="botao">
                    <div><span>Conheça nossos lanches</span></div>
                </button>

            </div>

            <div class="direita-banner">
                <img src="assets/heroBurger.png" alt="burger-banner">
            </div>
        </div>

        <div class="pesquisa">
            <form action="">
                <div class="bloco-form">
                    <label for="pesquisa">Pesquise seu lanche favorito!</label>
                    <input type="search" id="pesquisa" name="pesquisa" placeholder="Digite o nome do seu lanche!">
                </div>

                <div class="bloco-form">
                    <label for="categoria">Selecione uma categoria!</label>
                    <select name="categoria" id="categoria">
                        <option value="" disabled selected>Selecione uma opção</option>
                        <option value="carne">Carne</option>
                        <option value="frango">Frango</option>
                        <option value="vegano">Vegano</option>
                        <option value="entrada">Entradas</option>
                        <option value="bebida">Bebidas</option>
                        <option value="sobremesa">Sobremesas</option>
                    </select>
                </div>
            </form>
        </div>
    </main>
</body>


</html>
